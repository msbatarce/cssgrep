name: release

# Build standalone binaries, cut a GitHub Release, and publish to npm whenever a
# vX.Y.Z tag is pushed. npm auth uses OIDC trusted publishing (no token secret) —
# configure the repo as a trusted publisher for this workflow on npmjs.com.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # OIDC token for npm trusted publishing (+ provenance)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1; Node bundles an older npm.
      - run: npm install -g npm@latest
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm test
      # Bun cross-compiles every target from this one runner.
      - name: Build standalone binaries
        run: npm run build:binaries
      # Sanity-check the native (linux-x64) artifact before shipping it. The
      # other platforms' binaries can't run on this runner; the test matrix in
      # test.yml covers the source on macOS/Windows.
      - name: Smoke-test the built binary
        run: |
          ./dist/cssgrep-linux-x64 --version
          out=$(./dist/cssgrep-linux-x64 a testdata/blog.html)
          test -n "$out"
      - name: Generate checksums
        working-directory: dist
        run: sha256sum cssgrep-* > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cssgrep-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
      # Authenticates via OIDC — no token needed. Requires the repo to be
      # registered as a trusted publisher for release.yml on npmjs.com.
      - name: Publish to npm (OIDC trusted publishing)
        run: npm publish --provenance --access public
