<!doctype html>
<html lang="en">
  <head><title>Links</title></head>
  <body>
    <h1>Assorted links</h1>
    <ul id="links">
      <li><a href="https://example.com">secure external</a></li>
      <li><a href="http://example.org">plain external</a></li>
      <li><a href="/docs/start" data-track="docs">relative</a></li>
      <li><a href="mailto:hi@example.com">email</a></li>
      <li><a href="#section" class="anchor">in-page</a></li>
      <li><a name="section">no href (anchor target)</a></li>
      <li><a href="https://example.com/a" target="_blank" rel="noopener">new tab</a></li>
    </ul>

    <form action="/search" method="get">
      <input type="search" name="q" placeholder="Search" required>
      <input type="checkbox" name="exact" checked>
      <button type="submit">Go</button>
    </form>

    <img src="/logo.png" alt="Logo" width="120" height="40">
  </body>
</html>
