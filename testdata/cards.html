<!doctype html>
<html lang="en">
  <head><title>Shop</title></head>
  <body>
    <section class="grid">
      <div class="card" data-id="a1">
        <h3 class="title">Red Widget</h3>
        <p class="desc">A bright red widget.</p>
        <span class="price">$9.99</span>
        <button class="buy">Add to cart</button>
      </div>
      <div class="card" data-id="a2">
        <h3 class="title">Blue Widget</h3>
        <p class="desc">A calm blue widget.</p>
        <span class="price">$12.50</span>
        <button class="buy">Add to cart</button>
      </div>
      <div class="card featured" data-id="a3">
        <h3 class="title">Gold Widget</h3>
        <p class="desc">The premium choice.</p>
        <span class="price">$49.00</span>
        <button class="buy">Add to cart</button>
      </div>
    </section>
  </body>
</html>
